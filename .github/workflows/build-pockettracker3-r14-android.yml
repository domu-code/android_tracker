name: PocketTracker 3 R14 - Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out R14 build files
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and install pinned components
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu runner already includes command-line Android SDK tools.
          # Avoid setup-android@v3, which tries to install obsolete "tools".
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Verify R14 archive and acquire Android launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s PocketTracker3_R14_Android_Source.zip
          unzip -tq PocketTracker3_R14_Android_Source.zip | tail -2
          git clone --quiet https://github.com/conanizer/pockettracker.git upstream
          git -C upstream checkout --quiet --detach 1aef69ec9db79a3e29808c08ab520c04c26c8265
          test -s upstream/app/build.gradle.kts
          test -s upstream/native/vendor/SDL2/android/java/org/libsdl/app/SDLActivity.java
          test -s upstream/shell/licenses.txt
          mkdir -p r14-source
          unzip -q PocketTracker3_R14_Android_Source.zip -d r14-source

      - name: Overlay R14 engine, interface and factory data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, re, hashlib

          src = Path('r14-source/PocketTracker3')
          dst = Path('upstream')
          required = [
              'VERSION', 'native/CMakeLists.txt', 'shell/app.cpp',
              'shell/sdl/sdl-touch.cpp', 'shell/skin/portrait2.cpp',
              'shell/skin/keycap.h', 'native/songcore/lgpt_commands.h',
              'R14_README.md', 'factory/R14_Samples',
          ]
          for item in required:
              assert (src/item).exists(), f'Missing R14 component: {item}'
          assert (src/'VERSION').read_text().strip() == '0.18.0'
          manifest = json.loads((src/'SOURCE_MANIFEST.json').read_text())
          for rel in ['shell/sdl/sdl-touch.cpp', 'shell/skin/portrait2.cpp', 'shell/skin/keycap.h']:
              actual = hashlib.sha256((src/rel).read_bytes()).hexdigest()
              assert manifest.get(rel) == actual, f'R14 touch file checksum mismatch: {rel}'

          # Copy our complete R14 engine and shell over the original upstream Android scaffold.
          # Crucially, no destructive --delete: PortMaster R14 deliberately omitted the Android
          # app/ Kotlin launcher, Gradle files, and vendored SDL 2.30.9; preserve those.
          shutil.copytree(src, dst, dirs_exist_ok=True)
          assert (dst/'native/vendor/SDL2/android/java/org/libsdl/app/SDLActivity.java').exists()
          assert (dst/'app/src/main/java/com/conanizer/pockettracker/MainActivity.kt').exists()

          gradle_file = dst/'app/build.gradle.kts'
          text = gradle_file.read_text()
          for pattern, replacement in [
              (r'applicationId\s*=\s*"com\.conanizer\.pockettracker"',
               'applicationId = "com.oll.pockettracker3.r14"'),
              (r'versionCode\s*=\s*\d+', 'versionCode = 1400'),
              (r'versionName\s*=\s*"[^"]+"', 'versionName = "0.18.0"'),
              (r'abiFilters\s*\+=\s*listOf\("arm64-v8a",\s*"x86_64"\)',
               'abiFilters += listOf("arm64-v8a")'),
          ]:
              text, count = re.subn(pattern, replacement, text, count=1)
              assert count == 1, f'Could not patch exactly one Android setting: {pattern}'
          gradle_file.write_text(text)

          strings = dst/'app/src/main/res/values/strings.xml'
          if strings.is_file():
              s, n = re.subn(r'(<string\s+name="app_name"[^>]*>)[^<]*(</string>)',
                             r'\g<1>PocketTracker 3 R14\g<2>', strings.read_text(), count=1)
              assert n == 1, 'Cannot locate app_name in strings.xml'
              strings.write_text(s)

          print('R14 verified: release 0.18.0, separate ARM64 Android app ID, M8-style keys.')
          print('Upstream Android launcher pinned; PortMaster R14 engine and assets overlaid.')
          PY

      - name: Compile and sign an installable Android debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug

      - name: Verify APK native libraries and identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = next(Path('upstream/app/build/outputs/apk/debug').glob('*.apk'))
          with ZipFile(apk) as z:
              names = set(z.namelist())
              for entry in (
                  'lib/arm64-v8a/libSDL2.so',
                  'lib/arm64-v8a/libpockettracker.so',
                  'lib/arm64-v8a/libpockettracker-sdl.so',
              ):
                  assert entry in names, f'APK missing {entry}'
              assert 'AndroidManifest.xml' in names
              assert any(n.startswith('assets/licenses/') for n in names)
          print('Installable Android APK exists:', apk, 'size', apk.stat().st_size)
          PY
          mkdir -p release
          cp upstream/app/build/outputs/apk/debug/*.apk release/PocketTracker3-R14-Android-test.apk
          sha256sum release/PocketTracker3-R14-Android-test.apk > release/SHA256SUMS.txt

      - name: Upload APK and checksum
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: PocketTracker3-R14-Android-APK
          path: release/
          if-no-files-found: warn
          retention-days: 30
